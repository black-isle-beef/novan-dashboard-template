<aside id="app-sidebar" class="app-sidebar" [class.is-open]="uiState.isSidebarOpen()" aria-labelledby="sidebar-title">
  <p id="sidebar-title" class="visually-hidden">Main navigation</p>
  <nav aria-label="Main navigation">
    <a href="#" class="active"><i class="bi bi-columns-gap" aria-hidden="true"></i><span>Dashboard</span></a>
    <a href="#"><i class="bi bi-bar-chart-line" aria-hidden="true"></i><span>Analytics</span></a>
    <a href="#"><i class="bi bi-people" aria-hidden="true"></i><span>Users</span></a>
    <a href="#"><i class="bi bi-sliders2" aria-hidden="true"></i><span>Settings</span></a>

    <button
      class="sidebar-toggle"
      type="button"
      (click)="uiState.toggleSidebar()"
      [attr.aria-expanded]="uiState.isSidebarOpen()"
      aria-controls="app-sidebar"
      [attr.aria-label]="uiState.isSidebarOpen() ? 'Close navigation menu' : 'Open navigation menu'"
    >
      <i class="bi bi-chevron-right" aria-hidden="true"></i>
    </button>
  </nav>
</aside>
